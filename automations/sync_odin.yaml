blueprint:
  name: Sync a Home Assistant Value to ODIN (REST)
  description: >
    Forwards one Home Assistant sensor value to one ODIN field over its REST API:
    battery_soc_kwh, battery_max_discharge_kw, room_override_z1/_z2,
    discharge_override_z1/_z2, consumption_override_kwh, production_meter_kwh.
    Setup and accepted ranges: automations/setup_sync.md.
  domain: automation
  input:
    source_entity:
      name: Source Sensor
      description: >
        The sensor to forward: energy in kWh for the battery state of charge, the
        consumption override and the production counter, power in kW for the discharge
        limit, temperature in °C for the room override. The discharge fields also take an
        on/off entity; the production counter needs the inverter's total-energy entity,
        not its instantaneous power one.
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - input_boolean
            - switch

    odin_host:
      name: ODIN Address
      description: IP or hostname of the ODIN on the LAN (e.g. 192.168.2.190).
      selector:
        text: {}

    target_field:
      name: ODIN Field
      description: >
        Which ODIN value this sensor feeds. Writing 0 turns the room, consumption and
        production overrides off; the discharge fields take 0 for "not discharging".
      default: battery_soc_kwh
      selector:
        select:
          mode: dropdown
          options:
            - battery_soc_kwh
            - battery_max_discharge_kw
            - room_override_z1
            - room_override_z2
            - discharge_override_z1
            - discharge_override_z2
            - consumption_override_kwh
            - production_meter_kwh

    discharge_threshold:
      name: Discharge Threshold
      description: >
        Only used by the discharge fields when the source is numeric: above this counts
        as discharging (1), at or below it as not discharging (0), and it is ignored for
        an on/off entity. Set it just above the source's noise, e.g. 5 for a power
        sensor in watts that idles at 0-3 W.
      default: 0.5
      selector:
        number:
          mode: box

variables:
  source: !input source_entity
  host: !input odin_host
  field: !input target_field
  threshold: !input discharge_threshold
  state_str: "{{ states(source) }}"
  # Room fields accept 0 (off) or 5..40 °C; every other field is a plain range.
  is_room_field: "{{ field in ('room_override_z1', 'room_override_z2') }}"
  # The discharge fields are a 0/1 switch on the ODIN, so the source is reduced to a
  # boolean here.
  is_discharge_field: "{{ field in ('discharge_override_z1', 'discharge_override_z2') }}"
  # The production counter moves continuously and the ODIN only believes it for 20
  # minutes after a write, so it gets a finer band and a faster beat than the rest.
  is_prod_field: "{{ field == 'production_meter_kwh' }}"
  write_band: "{{ 0.005 if is_prod_field else 0.05 }}"
  is_on_state: "{{ state_str in ('on', 'true') }}"
  is_off_state: "{{ state_str in ('off', 'false') }}"
  bool_value: >-
    {{ 1 if is_on_state else 0 if is_off_state
       else (1 if (state_str | float(-99999)) > (threshold | float(0.5)) else 0) }}
  # These bands are the device's own limits (kConsumptionOverrideMax in
  # hp_telemetry.h, kProductionMeterMax in solar_feedback.h), so an impossible reading
  # is refused here as well as on the ODIN.
  battery_range: >-
    {{ {'battery_soc_kwh': [0, 2000],
        'battery_max_discharge_kw': [0, 100],
        'consumption_override_kwh': [0, 1000000],
        'production_meter_kwh': [0, 100000000]}.get(field, [0, 2000]) }}

trigger:
  - platform: state
    entity_id: !input source_entity

  - platform: homeassistant
    event: start

  # One beat a minute for the whole blueprint; the condition below decides which field
  # acts on which trigger.
  - platform: time_pattern
    minutes: "/1"

condition:
  - condition: template
    value_template: >-
      {#- Cadence before content: the minute beat belongs to the production field alone,
          and that field never acts on a state change because an inverter sensor reports
          every few seconds. trigger.now is the scheduled minute. -#}
      {% set beat_minute = (trigger.now.minute if trigger.now is defined
                            else now().minute) | int(0) %}
      {% if trigger.platform == 'time_pattern' and beat_minute % 5 != 0
            and not is_prod_field %}
        {{ false }}
      {% elif trigger.platform == 'state' and is_prod_field %}
        {{ false }}
      {% else %}
        {% set raw = states(source) | float(-99999) %}
        {% if is_discharge_field %}
          {{ is_on_state or is_off_state or is_number(states(source)) }}
        {% elif not is_number(states(source)) %}
          {{ false }}
        {% elif is_room_field %}
          {{ raw == 0 or (raw >= 5 and raw <= 40) }}
        {% else %}
          {% set lo, hi = battery_range %}
          {{ raw >= lo and raw <= hi }}
        {% endif %}
      {% endif %}

action:
  - wait_template: "{{ states(source) not in (none, 'unknown', 'unavailable') }}"
    timeout: "00:02:00"
    continue_on_timeout: false
  - variables:
      # Always a JSON number: 1/0 for the discharge switches, a float otherwise.
      value: >-
        {{ (bool_value | int(0)) if is_discharge_field
           else (states(source) | float(-99999)) }}
      # 0 sends no ts: the ODIN stamps the arrival itself, which is what makes a room
      # value that sits steady for hours a measurement to the physics learners.
      ts: 0

  - service: rest_command.odin_get
    response_variable: odin_resp
    continue_on_error: true
    data:
      host: "{{ host }}"

  - condition: template
    value_template: >-
      {% set v = value | float(-99999) %}
      {% if odin_resp is defined and odin_resp is not none %}
        {% set body = odin_resp['content'] %}
        {% if body is string %}{% set body = body | from_json %}{% endif %}
        {% if is_discharge_field %}
          {% set held = body.get(field, false) %}
          {{ (1 if (held is sameas true or held == 1) else 0) != (1 if v > 0.5 else 0) }}
        {# A room number is re-sent even when it agrees; the rest on change only. #}
        {% elif is_room_field %}
          {{ true }}
        {% else %}
          {{ (v - (body.get(field, -99999) | float(-99999))) | abs > write_band }}
        {% endif %}
      {% else %}{{ true }}{% endif %}

  - service: rest_command.odin_set
    continue_on_error: true
    data:
      host: "{{ host }}"
      key: "{{ field }}"
      value: "{{ value }}"
      ts: "{{ ts }}"

mode: single
max_exceeded: silent
